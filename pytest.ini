[pytest]
# The modules under test (vhh_core, codons, structure, shell, compute...) sit at
# the repository root, and the tests import them by name. Without this line,
# `pytest` run as a bare command puts only `tests/` on the import path and every
# test module fails to import, while `python -m pytest` happens to work because
# `python -m` adds the working directory itself. Telling someone to run `pytest`
# and only ever testing with `python -m pytest` is how that difference goes
# unnoticed; `pythonpath` makes both behave the same.
pythonpath = .

markers =
    smoke: drives the whole app through Streamlit AppTest (slow; "-m \"not smoke\"" to skip)
